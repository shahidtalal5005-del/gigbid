services:
  - type: web
    name: gigbid-agentic-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd apps/web && npm install && npm run build
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "22.14.0"